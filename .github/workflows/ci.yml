name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [00-stream-proxy, 04-ship, 05-store, 06-llm-basics, 07-llm-api, 08-structured-output, 09-reasoning, 10-prompt-cache, 11-context, 12-tools, 13-mcp, 14-a2a, 15-computer-use, 16-sandbox, 17-patterns, 18-loop, 19-multiagent]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 15
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/agent?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: projects/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: projects/${{ matrix.project }}/go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  ts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [01-ts-agent-core, 03-streaming]
    defaults:
      run:
        working-directory: projects/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: projects/${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/02-py-agent-core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run pytest -q

  docker:
    needs: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build --build-arg VERSION=${GITHUB_SHA::7} -t agent-ship projects/04-ship
      - name: smoke test
        run: |
          docker run -d --name ship -p 8080:8080 agent-ship
          for i in $(seq 1 20); do curl -fs localhost:8080/healthz && break; sleep 0.5; done
          curl -fsN -X POST localhost:8080/chat -d '{"prompt":"hi"}' | grep -q '\[DONE\]'
          docker stop -t 10 ship
          docker logs ship | grep -q '"msg":"bye"'
